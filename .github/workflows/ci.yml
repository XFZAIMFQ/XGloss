name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build-and-verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm test

            - name: Build extension
              run: npm run build

            - name: Package extension zip
              run: npm run zip

            - name: Upload extension artifact
              uses: actions/upload-artifact@v4
              with:
                  name: xgloss-chrome-mv3
                  path: .output/*.zip
                  if-no-files-found: error
